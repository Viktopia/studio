<section id="projects" class="relative py-20 md:py-28 border-t border-[color:var(--color-rule)] bg-[color:var(--color-paper-soft)]">
  <div class="page-container">
    <div class="grid grid-cols-12 gap-8 items-end mb-12 md:mb-16">
      <div class="col-span-12 md:col-span-8">
        <h2 class="section-headline">
          Projects <em>in flight</em>.
        </h2>
      </div>
      <div class="col-span-12 md:col-span-4">
        <p class="text-[color:var(--color-ink-soft)] leading-relaxed">
          What we ship and tend — each open at the source and run as its
          own small concern.
        </p>
      </div>
    </div>

    {{ $projects := where site.RegularPages "Section" "projects" }}
    {{ $projects = $projects.ByWeight }}

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
      {{ range $projects }}
        {{ partial "project-card.html" . }}
      {{ end }}
    </div>
  </div>
</section>
